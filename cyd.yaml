    on_value:
      then:
        - lvgl.label.update:
            id: val_s3
            text: !lambda 'return str_sprintf("%.1f${s3_unit}", x);'
        - lvgl.label.update:
            id: icon_s3
            text: !lambda |-
              ${s3_icon_logic}
        - lvgl.label.update:
            id: icon_s3
            text_color: !lambda |-
              ${s3_color_logic}

  - platform: homeassistant
    id: ha_sensor_4
