substitutions:
  # ==============================================================================
  #  CONFIGURATION HEADER (MASTER TEMPLATE)
  #  Customize your sensors, icons, and labels below.
  #  The variable 'x' represents the current numerical value from the HA sensor.
  # ==============================================================================

  # --- SENSOR 1: SOLAR ---
  s1_entity: "light.office_lamp"
  s1_label: "Office Lamp"
  s1_unit: "%%"
  s1_tap_action: "light.office_lamp"
  s1_icon: "\uec0f"
  
  s1_icon_logic: |-
    return "${s1_icon}"; 
    
  s1_color_logic: |-
    if (x > 0) return lv_color_hex(0xFFD700);
    return lv_color_hex(0x888888);

  # --- SENSOR 2: WATER ---
  s2_entity: "light.h607c"
  s2_label: "Office Floor Lamp"
  s2_unit: "%%"
  s2_tap_action: "light.h607c"
  s2_icon: "\uf061"

  s2_icon_logic: |-
    return "${s2_icon}";
    
  s2_color_logic: |-
    if (x > 0) return lv_color_hex(0xFFD700);
    return lv_color_hex(0x888888);

  # --- SENSOR 3: OFFICE DOOR TEMP ---
  s3_entity: "sensor.study_study_door_temperature"
  s3_label: "Office Door"
  s3_unit: "°C"
  s3_tap_action: "script.dummy_script"
  s3_icon: "\uf102"

  s3_icon_logic: |-
    return "${s3_icon}";
    
  s3_color_logic: |-
    if (x > 25) return lv_color_hex(0xFFA500);
    if (x < 15) return lv_color_hex(0x00BFFF);
    return lv_color_hex(0x32CD32);

  # --- SENSOR 4: OFFICE DOOR BATTERY ---
  s4_entity: "sensor.study_study_door_battery"
  s4_label: "Door Battery"
  s4_unit: "%%"
  s4_tap_action: "script.dummy_script"
  s4_icon: "\ue1ff"

  s4_icon_logic: |-
    return "${s4_icon}";
    
  s4_color_logic: |-
    if (x < 20) return lv_color_hex(0xFF5252);
    if (x < 40) return lv_color_hex(0xFFA500);
    return lv_color_hex(0x32CD32);

  # --- SENSOR 5: OFFICE FRAME BATTERY (Dynamic Icons) ---
  s5_entity: "sensor.office_frame_battery"
  s5_label: "Frame Battery"
  s5_unit: "%%"
  s5_tap_action: "script.dummy_script"
  
  s5_default_icon: "\uebd2" 
  s5_all_dynamic_icons: "\uebd2\uebd4\uebe2\uebdd\uebe0\uebd9"

  s5_icon_logic: |-
    if (x >= 90) return "\uebd2";
    if (x >= 75) return "\uebd4";
    if (x >= 50) return "\uebe2";
    if (x >= 30) return "\uebdd";
    if (x >= 20) return "\uebe0";
    return "\uebd9";
    
  s5_color_logic: |-
    if (x >= 90) return lv_color_hex(0x008000);  
    if (x >= 75) return lv_color_hex(0x269a17);  
    if (x >= 50) return lv_color_hex(0xa6d51f);  
    if (x >= 30) return lv_color_hex(0xFFA500);  
    if (x >= 20) return lv_color_hex(0x8B0000);  
    return lv_color_hex(0x640B0B);               

  # --- SENSOR 6: NAS USED SPACE ---
  s6_entity: "sensor.filestation_volume_2_used_space"
  s6_label: "NAS Used"
  s6_unit: "TB"
  s6_tap_action: "script.dummy_script"
  s6_icon: "\ue798"

  s6_icon_logic: |-
    return "${s6_icon}";
    
  s6_color_logic: |-
    if (x > 14.76) return lv_color_hex(0xFF5252);
    if (x > 12.3) return lv_color_hex(0xFFA500);
    return lv_color_hex(0x00BFFF);

  # --- RADAR PAGE ---
  # Centred on Radlett, Hertfordshire (the board has no GPS, so this is fixed).
  radar_lat: "51.6836"
  radar_lon: "-0.3181"
  # Search radius in nautical miles. This board has no PSRAM, so a 96KB
  # response buffer failed to allocate outright near a busy area (25nm was
  # ~52KB of JSON). 12nm keeps the response comfortably small; raise it only
  # if you've confirmed there's headroom (watch "free heap before fetch" in
  # the logs) - see max_response_buffer_size below.
  radar_range_nm: "12"
  # How often to re-poll adsb.lol. Their courtesy limit is ~1 request/second,
  # so there's no reason to go faster than this.
  radar_refresh: "45s"

http_request:
  timeout: 5s

json:

# --- RADAR: fetch adsb.lol and redraw the canvas ---
script:
  - id: radar_refresh_script
    then:
      - lambda: |-
          ESP_LOGD("radar", "free heap before fetch: %u bytes", (unsigned) esp_get_free_heap_size());
      - http_request.get:
          # Plain HTTP on purpose: adsb.lol serves it fine, and skipping the TLS
          # handshake avoids its (large, on ESP32) buffer allocation - the real
          # cause of the failures below. No credentials involved either way.
          url: "http://api.adsb.lol/v2/point/${radar_lat}/${radar_lon}/${radar_range_nm}"
          capture_response: true
          # http_request.get() allocates this whole buffer as ONE contiguous
          # block up front. A 96KB ask over HTTPS failed outright (no free
          # heap for the TLS handshake). Switching to plain HTTP + shrinking
          # the canvas got free heap up to ~82KB - plenty for this. Real
          # payload at 12nm measured ~21.3KB; give it real headroom.
          max_response_buffer_size: 32kB
          on_response:
            then:
              - lambda: |-
                  ESP_LOGD("radar", "adsb.lol response: status=%d bytes=%u",
                           response->status_code, (unsigned) body.size());
                  auto r = radar::summarize(${radar_lat}, ${radar_lon}, ${radar_range_nm},
                                            body, response->status_code == 200);
                  lv_label_set_text(id(val_radar_status), r.status);
                  lv_label_set_text(id(val_radar_callsign), r.callsign);
                  lv_label_set_text(id(val_radar_line1), r.line1);
                  lv_label_set_text(id(val_radar_line2), r.line2);
                  lv_label_set_text(id(val_radar_sub), r.sub);
                  lv_label_set_text(id(val_radar_next1), r.next1);
                  lv_label_set_text(id(val_radar_next2), r.next2);
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("radar", "adsb.lol request failed (no response)");
                  auto r = radar::summarize(${radar_lat}, ${radar_lon}, ${radar_range_nm}, "", false);
                  lv_label_set_text(id(val_radar_status), r.status);
                  lv_label_set_text(id(val_radar_callsign), r.callsign);
                  lv_label_set_text(id(val_radar_line1), r.line1);
                  lv_label_set_text(id(val_radar_line2), r.line2);
                  lv_label_set_text(id(val_radar_sub), r.sub);
                  lv_label_set_text(id(val_radar_next1), r.next1);
                  lv_label_set_text(id(val_radar_next2), r.next2);

