              if (x == "windy-variant") return "Windy";
              return x;

# ==============================================================================
#  PRINTER PAGE POLLING (BambuHelper /status endpoint)
# ==============================================================================
interval:
  - interval: 10s
    then:
      - http_request.get:
          url: "http://192.168.3.150/status"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  json::parse_json(body, [](JsonObject root) -> bool {
                    std::string state = root["state"] | "";
                    float progress = root["progress"] | 0.0f;
                    float nozzle = root["nozzle"] | 0.0f;
                    float bed = root["bed"] | 0.0f;
                    float fan = root["fan"] | 0.0f;
                    int layer = root["layer"] | 0;

                    std::string status_text = state;
                    if (state == "IDLE") status_text = "Idle";
                    else if (state == "RUNNING") status_text = "Printing";
                    else if (state == "PAUSE") status_text = "Paused";
                    else if (state == "FINISH") status_text = "Finished";
                    else if (state == "FAILED") status_text = "Failed";
                    else if (state == "PREPARE") status_text = "Preparing";

                    lv_label_set_text(id(val_p_status), status_text.c_str());
                    lv_label_set_text(id(val_p_progress), str_sprintf("%.0f%%", progress).c_str());
                    lv_label_set_text(id(val_p_nozzle), str_sprintf("%.0f°C", nozzle).c_str());
                    lv_label_set_text(id(val_p_bed), str_sprintf("%.0f°C", bed).c_str());
                    lv_label_set_text(id(val_p_fan), str_sprintf("%.0f%%", fan).c_str());
                    lv_label_set_text(id(val_p_layer), str_sprintf("%d", layer).c_str());
                    return true;
                  });
          on_error:
            then:
              - lvgl.label.update:
                  id: val_p_status
                  text: "Offline"

  # --- RADAR: periodic adsb.lol refresh ---
  - interval: ${radar_refresh}
    then:
      - script.execute: radar_refresh_script

